name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: python -m pip install ruff==0.16.9

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Run lint checks
        run: python -m ruff check src tests

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: pytest -q

  task-linkage:
    name: task-linkage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Confirm task or issue linkage
        run: |
          python - <<'PY'
          import os
          body = os.environ.get('PR_BODY', '')
          checks = [
              'Fixes #',
              'Closes #',
              'Task:',
              'Related task:',
          ]
          if not any(token in body for token in checks):
              raise SystemExit('Pull requests must reference a task or issue with "Fixes #", "Closes #", or "Task:".')
          print('PR task linkage check passed')
          PY
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
