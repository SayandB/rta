name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  ai-review:
    name: ai-review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out pull request and base history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require Copilot review credential
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "Repository Actions secret COPILOT_PAT is required for AI review." >&2
            exit 1
          fi

      - name: Install Copilot CLI
        run: npm install --global @github/copilot

      - name: Prepare bounded pull request diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          mkdir -p artifacts
          git diff --no-ext-diff --unified=3 "FETCH_HEAD...HEAD" -- . ':(exclude)*.lock' ':(exclude)*.min.*' > artifacts/pr.diff
          python - <<'PY'
          from pathlib import Path

          diff_path = Path("artifacts/pr.diff")
          content = diff_path.read_text(encoding="utf-8", errors="replace")
          limit = 100_000
          if len(content) > limit:
              content = content[:limit] + "\n\n[Diff truncated at 100,000 characters.]\n"
              diff_path.write_text(content, encoding="utf-8")
          PY

      - name: Add AI review summary
        id: inference
        uses: actions/ai-inference@v1
        with:
          prompt-file: ./.github/prompts/pr-review.prompt.yml
          file_input: |
            diff: ./artifacts/pr.diff
          model: gpt-4.1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}

      - name: Publish AI review to pull request
        uses: actions/github-script@v7
        env:
          AI_REVIEW: ${{ steps.inference.outputs.response }}
        with:
          script: |
            const review = process.env.AI_REVIEW?.trim();
            if (!review) {
              core.setFailed('Copilot returned an empty review.');
              return;
            }
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'COMMENT',
              body: `## Copilot AI review\n\n${review}\n\n> AI review is advisory; maintainer approval and required CI checks are still required.`,
            });
