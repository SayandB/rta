name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  ai-review:
    name: ai-review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Add AI review summary
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const body = [
              '## AI review summary',
              '',
              '- Reviewed for task alignment, design fit, security posture, and test coverage.',
              '- Expected gate: lint, test (3.10), test (3.11), task-linkage must pass before merge.',
              '- Review focus: maintainability, dependency direction, edge-case correctness, and rollback risk.',
              `- PR: ${title}`,
              '',
              '> This workflow acts as an AI-assisted review placeholder. Human maintainer confirmation remains required before merge.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
